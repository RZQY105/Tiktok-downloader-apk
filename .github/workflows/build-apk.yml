name: Build Multi-Platform APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Project & High-Speed Stream Plugin
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/mediadownloader/app

          cat << 'EOF' > android/app/src/main/java/com/mediadownloader/app/MediaSaverPlugin.java
          package com.mediadownloader.app;

          import android.content.ContentValues;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "MediaSaver")
          public class MediaSaverPlugin extends Plugin {
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @PluginMethod
              public void downloadAndSave(PluginCall call) {
                  String fileUrl = call.getString("url");
                  String fileName = call.getString("fileName");
                  String mimeType = call.getString("mimeType", "video/mp4");
                  String referer = call.getString("referer", "");

                  if (fileUrl == null || fileName == null) {
                      call.reject("URL atau nama file tidak valid");
                      return;
                  }

                  executor.execute(() -> {
                      HttpURLConnection connection = null;
                      Uri itemUri = null;
                      try {
                          URL currentUrl = new URL(fileUrl);
                          int redirects = 0;

                          while (redirects < 5) {
                              connection = (HttpURLConnection) currentUrl.openConnection();
                              connection.setConnectTimeout(15000);
                              connection.setReadTimeout(30000);
                              connection.setInstanceFollowRedirects(false);
                              connection.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36");
                              if (referer != null && !referer.isEmpty()) {
                                  connection.setRequestProperty("Referer", referer);
                              }

                              int status = connection.getResponseCode();
                              if (status == HttpURLConnection.HTTP_MOVED_TEMP ||
                                  status == HttpURLConnection.HTTP_MOVED_PERM ||
                                  status == HttpURLConnection.HTTP_SEE_OTHER ||
                                  status == 307 || status == 308) {
                                  String newLoc = connection.getHeaderField("Location");
                                  connection.disconnect();
                                  currentUrl = new URL(currentUrl, newLoc);
                                  redirects++;
                              } else {
                                  break;
                              }
                          }

                          int responseCode = connection.getResponseCode();
                          if (responseCode < 200 || responseCode >= 300) {
                              call.reject("Server menolak akses (HTTP " + responseCode + ")");
                              return;
                          }

                          long totalBytes = connection.getContentLengthLong();
                          boolean isAudio = mimeType.startsWith("audio");
                          OutputStream outputStream;
                          File legacyFile = null;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              Uri collection;
                              if (isAudio) {
                                  collection = MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                                  values.put(MediaStore.Audio.Media.DISPLAY_NAME, fileName);
                                  values.put(MediaStore.Audio.Media.MIME_TYPE, mimeType);
                                  values.put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/MediaVault");
                              } else {
                                  collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                                  values.put(MediaStore.Video.Media.DISPLAY_NAME, fileName);
                                  values.put(MediaStore.Video.Media.MIME_TYPE, mimeType);
                                  values.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/MediaVault");
                              }

                              itemUri = getContext().getContentResolver().insert(collection, values);
                              if (itemUri == null) {
                                  call.reject("Gagal menyiapkan penyimpanan media");
                                  return;
                              }
                              outputStream = getContext().getContentResolver().openOutputStream(itemUri);
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(
                                  isAudio ? Environment.DIRECTORY_MUSIC : Environment.DIRECTORY_MOVIES
                              );
                              File appDir = new File(dir, "MediaVault");
                              if (!appDir.exists()) appDir.mkdirs();
                              legacyFile = new File(appDir, fileName);
                              outputStream = new FileOutputStream(legacyFile);
                          }

                          if (outputStream == null) {
                              call.reject("Tidak dapat membuka aliran penyimpanan");
                              return;
                          }

                          byte[] buffer = new byte[65536]; // 64KB High-Speed Buffer
                          long downloadedBytes = 0;
                          long startTime = System.currentTimeMillis();
                          long lastEmitTime = 0;
                          int bytesRead;

                          try (InputStream in = new BufferedInputStream(connection.getInputStream(), 65536);
                               OutputStream out = outputStream) {
                              while ((bytesRead = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, bytesRead);
                                  downloadedBytes += bytesRead;

                                  long now = System.currentTimeMillis();
                                  if (now - lastEmitTime >= 150) {
                                      lastEmitTime = now;
                                      double elapsedSec = Math.max((now - startTime) / 1000.0, 0.1);
                                      double speedMBs = (downloadedBytes / (1024.0 * 1024.0)) / elapsedSec;
                                      int percent = totalBytes > 0 ? (int) Math.min(99, (downloadedBytes * 100) / totalBytes) : -1;

                                      JSObject progress = new JSObject();
                                      progress.put("percent", percent);
                                      progress.put("downloadedMB", String.format("%.1f", downloadedBytes / (1024.0 * 1024.0)));
                                      progress.put("speed", String.format("%.1f MB/s", speedMBs));
                                      notifyListeners("downloadProgress", progress);
                                  }
                              }
                              out.flush();
                          }

                          if (legacyFile != null) {
                              MediaScannerConnection.scanFile(
                                  getContext(),
                                  new String[]{legacyFile.getAbsolutePath()},
                                  new String[]{mimeType},
                                  null
                              );
                          }

                          JSObject ret = new JSObject();
                          ret.put("saved", true);
                          ret.put("folder", isAudio ? "Music/MediaVault" : "Movies/MediaVault");
                          ret.put("sizeMB", String.format("%.1f MB", downloadedBytes / (1024.0 * 1024.0)));
                          call.resolve(ret);

                      } catch (Exception e) {
                          if (itemUri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              try { getContext().getContentResolver().delete(itemUri, null, null); } catch (Exception ignored) {}
                          }
                          call.reject("Gagal mengunduh: " + e.getMessage());
                      } finally {
                          if (connection != null) connection.disconnect();
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mediadownloader/app/MainActivity.java
          package com.mediadownloader.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaSaverPlugin.class);
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  if (window != null) {
                      window.setStatusBarColor(Color.parseColor("#06070A"));
                      window.setNavigationBarColor(Color.parseColor("#06070A"));
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings settings = this.bridge.getWebView().getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                  }
              }
          }
          EOF

          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" \/>/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
