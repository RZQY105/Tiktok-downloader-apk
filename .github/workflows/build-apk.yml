name: Build Multi-Platform APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Project & Native Plugins
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/mediadownloader/app

          cat << 'EOF' > android/app/src/main/java/com/mediadownloader/app/MediaSaverPlugin.java
          package com.mediadownloader.app;

          import android.content.ContentValues;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "MediaSaver")
          public class MediaSaverPlugin extends Plugin {
              @PluginMethod
              public void saveMedia(PluginCall call) {
                  String base64Data = call.getString("base64Data");
                  String fileName = call.getString("fileName");
                  String mimeType = call.getString("mimeType", "video/mp4");

                  if (base64Data == null || fileName == null) {
                      call.reject("Data atau nama file kosong");
                      return;
                  }

                  try {
                      if (base64Data.contains(",")) {
                          base64Data = base64Data.substring(base64Data.indexOf(",") + 1);
                      }
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      boolean isAudio = mimeType.startsWith("audio");

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          Uri collection;

                          if (isAudio) {
                              collection = MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                              values.put(MediaStore.Audio.Media.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Audio.Media.MIME_TYPE, mimeType);
                              values.put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/MediaDownloader");
                          } else {
                              collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                              values.put(MediaStore.Video.Media.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Video.Media.MIME_TYPE, mimeType);
                              values.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/MediaDownloader");
                          }

                          Uri itemUri = getContext().getContentResolver().insert(collection, values);
                          if (itemUri == null) {
                              call.reject("Gagal membuat entri MediaStore");
                              return;
                          }

                          try (OutputStream out = getContext().getContentResolver().openOutputStream(itemUri)) {
                              if (out != null) {
                                  out.write(bytes);
                                  out.flush();
                              }
                          }
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(
                              isAudio ? Environment.DIRECTORY_MUSIC : Environment.DIRECTORY_MOVIES
                          );
                          File appDir = new File(dir, "MediaDownloader");
                          if (!appDir.exists()) appDir.mkdirs();

                          File outFile = new File(appDir, fileName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }

                          MediaScannerConnection.scanFile(
                              getContext(),
                              new String[]{outFile.getAbsolutePath()},
                              new String[]{mimeType},
                              null
                          );
                      }

                      JSObject ret = new JSObject();
                      ret.put("saved", true);
                      ret.put("folder", isAudio ? "Music/MediaDownloader" : "Movies/MediaDownloader");
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Gagal simpan file: " + e.getMessage());
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mediadownloader/app/MainActivity.java
          package com.mediadownloader.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaSaverPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings settings = this.bridge.getWebView().getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                  }
              }
          }
          EOF

          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" \/>/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaVault-HD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
